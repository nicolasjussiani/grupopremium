{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d2149">
  <title>{{ status_code }} — {{ titulo }} | ERP Grupo PremiumBR</title>
  <link rel="icon" href="{% static 'favicon.jpeg' %}" type="image/jpeg">
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f7fb; color: #17233a; }
    main { width: min(100%, 560px); padding: 36px; border: 1px solid #dfe6ef; border-top: 5px solid #c59a45; border-radius: 18px; background: #fff; box-shadow: 0 18px 50px rgba(13,33,73,.10); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; color: #0d2149; font-weight: 800; }
    .brand img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; }
    .code { color: #9a742e; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0 12px; font-size: clamp(1.65rem, 5vw, 2.25rem); }
    p { margin: 0 0 10px; color: #526077; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 10px 16px; border-radius: 9px; text-decoration: none; font-weight: 700; }
    .primary { background: #0d2149; color: #fff; }
    .secondary { border: 1px solid #cad3df; color: #0d2149; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="{% static 'logo.jpeg' %}" alt=""> Grupo PremiumBR</div>
    <div class="code">Erro {{ status_code }}</div>
    <h1>{{ titulo }}</h1>
    <p>{{ mensagem }}</p>
    <p>{{ orientacao }}</p>
    <div class="actions">
      <a class="primary" href="{% url 'dashboard' %}">Voltar ao painel</a>
      <a class="secondary" href="{% url 'ajuda' %}">Central de Ajuda</a>
    </div>
  </main>
</body>
</html>
